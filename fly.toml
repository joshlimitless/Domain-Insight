# Fly.io configuration for cord.to
app = "cord-to"
primary_region = "iad"

[build]
dockerfile = "Dockerfile"

[env]
NODE_ENV = "production"

[http_service]
internal_port = 5000
force_https = true
auto_start_machines = true
auto_stop_machines = true
min_machines_running = 1

[[services]]
protocol = "tcp"
internal_port = 5000

	[[services.ports]]
	handlers = ["http"]
	port = 80

	[[services.ports]]
	handlers = ["tls","http"]
	port = 443


[checks.alive]
type = "http"
interval = "30s"
timeout = "10s"
grace_period = "10s"
method = "GET"
path = "/"
protocol = "http"
min_interval = "10s"
